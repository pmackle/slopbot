[project]
name = "slopbot"
version = "0.1.0"
description = "A Slack bot that tells you if something was written by AI, and why."
readme = "README.md"
license = "MIT"
authors = [{ name = "Patrick Mackle" }]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.12.0",
    "braintrust>=0.52.0",
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "slack-bolt>=1.30.0",
]

[project.scripts]
slopbot = "slopbot.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
