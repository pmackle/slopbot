# Create the app at https://api.slack.com/apps -> Create New App -> From a manifest, and paste this.
display_information:
  name: Slopbot
  description: Tells you if something was written by AI, and why.
  background_color: "#1f1f24"
  long_description: >-
    Slopbot tells you if a message or image was made by AI, and why, in a couple of lines.
    Mention @Slopbot in a thread to check the parent message, mention it right after a message
    to check that one, DM it, or use the "Slop check" shortcut from any message's ⋯ menu.
    It's right a lot, but not every time, so please don't use it to get anyone in trouble.
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Slopbot
    always_online: true
  shortcuts:
    - name: Slop check
      type: message
      callback_id: slop_check
      description: Was this written by AI? Find out.
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - chat:write
      - commands
      - files:read
      - groups:history
      - im:history
      - mpim:history
      - reactions:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
